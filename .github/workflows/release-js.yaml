name: Release Foundation JS bundle

on:
  push:
    tags:
      - "js-v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 验证 JS 工作区与生产依赖
        run: |
          pnpm verify:js
          pnpm audit --prod --audit-level moderate
      - name: 校验发布版本
        shell: bash
        run: |
          base_ref="$(git tag --merged HEAD^ --list 'js-v*' --sort=-version:refname | head -n 1)"
          node scripts/validate-js-release.mjs "${base_ref}"
      - name: 检查公共包与独立消费者
        run: |
          pnpm --filter "./js/packages/*" --recursive pack --dry-run
          pnpm --filter @yueli/ui test:pack
      - name: 安装 CLI Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: 运行 CLI Playwright 验收
        run: |
          pnpm --filter @yueli/http-runtime-conformance test:e2e
          pnpm --filter @yueli/ui-foundation-conformance test:e2e

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: foundation-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 打包完整公共包集合
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          pnpm --filter "./js/packages/*" --recursive pack --pack-destination "${RUNNER_TEMP}/release"
          node scripts/write-js-release-manifest.mjs "${RUNNER_TEMP}/release" "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
      - name: 生成制品来源证明
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "${{ runner.temp }}/release/*"
      - name: 创建草稿并发布完整 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release/"* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Foundation JS ${GITHUB_REF_NAME#js-v}" \
            --generate-notes \
            --draft
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
